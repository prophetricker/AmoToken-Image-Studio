services:
  nova-image-studio:
    build: .
    image: amotoken/nova-image-studio:v0.5-local
    container_name: nova-image-studio
    cpus: "1.5"
    mem_limit: "1536m"
    memswap_limit: "1536m"
    ports:
      - "127.0.0.1:3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: "production"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      NOVA_INTERNAL_OPENAI_BASE_URL: "${NOVA_INTERNAL_OPENAI_BASE_URL:-}"
      NOVA_FORCE_BASE_URL: "${NOVA_FORCE_BASE_URL:-http://host.docker.internal:3000/v1}"
      NOVA_TASK_DB: "/app/backend/data/nova-tasks.sqlite"
      NOVA_IMAGE_DIR: "/app/backend/data/nova-images"
      NOVA_TASK_CONCURRENCY: "${NOVA_TASK_CONCURRENCY:-2}"
      NOVA_MAX_QUEUE_SIZE: "${NOVA_MAX_QUEUE_SIZE:-40}"
      NOVA_RATE_LIMIT_WINDOW_MS: "${NOVA_RATE_LIMIT_WINDOW_MS:-60000}"
      NOVA_RATE_LIMIT_MAX_REQUESTS_PER_IP: "${NOVA_RATE_LIMIT_MAX_REQUESTS_PER_IP:-8}"
      NOVA_RATE_LIMIT_MAX_REQUESTS_PER_API_KEY: "${NOVA_RATE_LIMIT_MAX_REQUESTS_PER_API_KEY:-6}"
      NOVA_MAX_PENDING_TASKS_PER_IP: "${NOVA_MAX_PENDING_TASKS_PER_IP:-10}"
      NOVA_MAX_PENDING_TASKS_PER_API_KEY: "${NOVA_MAX_PENDING_TASKS_PER_API_KEY:-8}"
      NOVA_RATE_LIMIT_RETRY_AFTER_SECONDS: "${NOVA_RATE_LIMIT_RETRY_AFTER_SECONDS:-60}"
      PROMPT_GALLERY_MODE: "${PROMPT_GALLERY_MODE:-1}"
    volumes:
      - ./data:/app/backend/data
      - ./backend/blacklist.json:/app/backend/blacklist.json:ro
      - ./backend/prompts.json:/app/backend/prompts.json:ro
    restart: unless-stopped
